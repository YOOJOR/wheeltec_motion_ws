wheeltec_motion_controller:
  ros__parameters:
    # 修改后重启节点；频率固定为控制 20 Hz、反馈 5 Hz。

    # 启用与安装：T_body_base；base_link 为厂家四轮几何中心。
    control_enabled: false # false 时不发布速度
    extrinsics_calibrated: false # 填写并确认本车外参后启用
    navigation_frame: base_link # 底盘控制参考点
    body_from_base_translation: [0.0, 0.0, 0.0] # m；第一台车 XY 为暂用安装估计，新车须重新测量
    body_from_base_rpy: [0.0, 0.0, 0.0] # rad

    # 速度与加速度
    max_linear_speed: 0.15 # m/s
    max_angular_speed: 0.35 # rad/s
    linear_accel: 0.15 # m/s²
    angular_accel: 0.5 # rad/s²；stop 直接归零

    # 直行与旋转：进入容差即结束；不做静止确认。
    distance_gain: 0.8 # 1/s
    heading_gain: 1.5 # 1/s
    rotation_gain: 1.2 # 1/s
    path_lookahead: 0.25 # m；路径跟踪前视距离
    distance_tolerance: 0.03 # m
    angle_tolerance: 0.035 # rad

    # 超时：源时间超前容许量固定为 0.1 s。
    navigation_command_timeout: 0.3 # s；导航源时间和接收时间有效期
    pose_timeout: 0.5 # s；位姿源时间和接收时间有效期
    default_timeout: 45.0 # s；动作请求可覆盖
