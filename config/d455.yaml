/camera/d455/raw/d455:
  ros__parameters:
    camera_name: d455
    device_type: d455
    enable_color: true
    enable_depth: true
    rgb_camera.color_profile: '640,480,15'
    depth_module.depth_profile: '640,480,15'
    rgb_camera.color_format: RGB8
    depth_module.depth_format: Z16
    enable_sync: true
    align_depth.enable: true
    enable_gyro: false
    enable_accel: false
    enable_infra1: false
    enable_infra2: false
    pointcloud.enable: false
    publish_tf: true
    wait_for_device_timeout: 10.0
